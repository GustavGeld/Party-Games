            clearInterval(this.state.timerInterval);
            if(actionType === 'drawing') this.finishDrawing(chainIndex, isOnline);
            else if(actionType === 'write') this.finishWrite(chainIndex, isOnline);
            else this.finishGuess(chainIndex, isOnline);
        }
    }, 1000);
  },

  /* ================= CANVAS LOGIC ================= */
  initCanvas() {
    const canvas = document.getElementById('kk-canvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    
    // We need to scale internal resolution to match displayed CSS size for good quality on mobile -> For simplicity we keep it 400x400 internally
    // Actually fixed width/height attributes are better, let's make it 400x400 internally
    canvas.width = 400;
    canvas.height = 400;
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    this.ctx = ctx;
    this.canvas = canvas;
    this.setBrush('#000000', 4);
    
    let drawing = false;
    
    const getPos = (e) => {
        let rect = canvas.getBoundingClientRect();
        let clientX = e.clientX;
        let clientY = e.clientY;
        if(e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        }
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    };

    const start = (e) => {
        e.preventDefault();
        drawing = true;
        let pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    };

    const draw = (e) => {
        if(!drawing) return;
        e.preventDefault();
        let pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    };

    const stop = (e) => {
        if(drawing) { e.preventDefault(); drawing = false; ctx.closePath(); }
    };

    canvas.addEventListener('mousedown', start, {passive:false});
    canvas.addEventListener('mousemove', draw, {passive:false});
    canvas.addEventListener('mouseup', stop, {passive:false});
    canvas.addEventListener('mouseout', stop, {passive:false});

    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', draw, {passive:false});
    canvas.addEventListener('touchend', stop, {passive:false});
    canvas.addEventListener('touchcancel', stop, {passive:false});
  },

  setBrush(color, size) {
    if(this.ctx) {
        this.ctx.strokeStyle = color;
        this.ctx.lineWidth = size;
    }
  },
  
  clearCanvas() {
    if(this.ctx && this.canvas) {
        this.ctx.fillStyle = '#ffffff';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    }
  },

  finishDrawing(chainIndex, isOnline) {
    clearInterval(this.state.timerInterval);
    if(!this.canvas) return;
    const base64 = this.canvas.toDataURL('image/jpeg', 0.8);
    if(isOnline) this.submitOnlineAction(chainIndex, 'drawing', base64);
    else this.submitOfflineAction(chainIndex, 'drawing', base64);
  },

  finishGuess(chainIndex, isOnline) {
    clearInterval(this.state.timerInterval);
    const input = document.getElementById('kk-guess-input');
    let val = input ? input.value.trim() : '';
    if(!val) val = "???"; // fallback
    if(isOnline) this.submitOnlineAction(chainIndex, 'guess', val);
    else this.submitOfflineAction(chainIndex, 'guess', val);
  },

  finishWrite(chainIndex, isOnline) {
    clearInterval(this.state.timerInterval);
    const input = document.getElementById('kk-write-input');
    let val = input ? input.value.trim() : '';
    if(!val) {
      // Pick random word if they sent nothing
      let pool = [];
      KritzelPackages.forEach(p => pool = pool.concat(p.tasks));
      val = pool[Math.floor(Math.random() * pool.length)] || 'Abenteuer';
    }
    if(isOnline) this.submitOnlineAction(chainIndex, 'word', val);
    else this.submitOfflineAction(chainIndex, 'word', val);
  },

  /* ================= RESULT SCREEN ================= */
  renderResultScreen() {
    clearInterval(this.state.timerInterval);
    Router.go('play');
    document.getElementById('play-game-name').textContent = 'Ergebnisse!';
    
    const chains = this.state.chains;
    let ht = `<div style="text-align:center; margin-bottom: 20px;"><p style="color:var(--text-muted);">Schaut euch die Ergebnisse an!</p></div>`;
    
    chains.forEach(c => {
       ht += `
        <div class="card" style="margin-bottom: 30px; animation: slideIn .4s cubic-bezier(.34, 1.15, .64, 1) both; overflow:hidden;">
            <div style="background: var(--surface2); margin: -22px -22px 20px -22px; padding: 15px 22px; border-bottom: 1px solid var(--border);">
               <strong style="color:var(--primary); font-family:'Abril Fatface', cursive; font-size: 1.4rem;">Startwort: ${c.entries[0].value}</strong>
               <p style="font-size:0.8rem; color:var(--text-muted);">(Begonnen von ${c.entries[0].playerName})</p>
            </div>
       `;
       
       for(let i=1; i<c.entries.length; i++) {
           const e = c.entries[i];
           ht += `<div style="margin-bottom: 20px; padding-left: 15px; border-left: 2px dashed ${e.type === 'drawing' ? 'var(--cyan)' : 'var(--secondary)'};">`;
           if(e.type === 'drawing') {
              ht += `<p style="font-size:0.8rem; color:var(--text-muted); margin-bottom: 5px;"><strong>${e.playerName}</strong> zeichnete:</p>`;
              ht += `<img src="${e.value}" style="width:100%; max-width:300px; border-radius: 8px; border: 2px solid var(--surface2);">`;
           } else {
              ht += `<p style="font-size:0.8rem; color:var(--text-muted); margin-bottom: 5px;"><strong>${e.playerName}</strong> tippte:</p>`;
              ht += `<h3 style="color:var(--secondary); font-size:1.5rem; font-weight:900;">"${e.value}"</h3>`;
           }
           ht += `</div>`;
       }
       ht += `</div>`;
    });
    
    if (Multiplayer.role === 'host') {
        ht += `<button class="btn-primary" style="background:var(--cyan); color:#000;" onclick="hostReturnToLobby()">Zurück zur Lobby</button>`;
    } else if (SharedRoom.isActive) {
        ht += `<p style="color:var(--text-muted);">Warte auf den Host...</p>`;
    } else {
        ht += `<button class="btn-primary" onclick="location.reload()">Zurück zum Hauptmenü</button>`;
    }
    ht += `<br><br><br>`;

    document.getElementById('play-content').innerHTML = ht;
  }

};
</script>
<script>
/* === lobby.js === */
/* ===================================================
   UnifiedLobby v2 — Inspired by Spektrum's online lobby
   Features:
   - Host: Raum erstellen, Code teilen, Name ändern, spielspezifische Einstellungen
   - Guest: Mit Code beitreten, Name ändern, Spielerliste sehen, warte auf Host
   - Host broadcastet game_start + Einstellungen an alle Guests
   =================================================== */

const UnifiedLobby = {
  currentGame: null,
  isInLobby: false,

  /* ===== ENTRY POINT ===== */
  open(gameObj) {
    this.currentGame = gameObj;
    this.isInLobby = true;
    const gameName = (gameObj && gameObj.name) ? gameObj.name : 'Spiel';

    // Wire up Multiplayer callbacks
    this._wireCallbacks();

    // Show a simple Host/Join screen (Raum-Code based, like Spektrum)
    Router.go('setup');
    document.getElementById('setup-title').textContent = gameName + ' — Online';

    document.getElementById('setup-content').innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="card-label">🏠 Raum erstellen</div>
        <input type="text" id="ul-host-name" class="player-input" placeholder="Dein Name" value="Host" style="margin-bottom:15px;">
        <button class="btn-primary" onclick="UnifiedLobby.hostRoom()">Raum erstellen</button>
      </div>
      <div class="card" style="text-align:center;">
        <div class="card-label">🔑 Raum beitreten</div>
        <input type="text" id="ul-guest-name" class="player-input" placeholder="Dein Name" value="" style="margin-bottom:10px;">
        <input type="text" id="ul-join-code" class="player-input" placeholder="Raum-Code (z.B. AB12)" style="margin-bottom:15px; text-transform:uppercase;">
        <button class="btn-primary" onclick="UnifiedLobby.joinRoom()">Beitreten</button>
      </div>
    `;
  },

  /* ===== CLIPBOARD HELPER ===== */
  copyRoomCode() {
    const code = Multiplayer.hostId;
    if (!code) return;
    
    navigator.clipboard.writeText(code).then(() => {
      const btn = document.getElementById('ul-copy-btn');
      if (btn) {
        const originalText = btn.innerHTML;
        btn.innerHTML = 'Kopiert! ✅';
        btn.classList.add('btn-success');
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('btn-success');
        }, 2000);
      }
    }).catch(err => {
      console.error('Copy failed', err);
    });
  },

  /* ===== GENERATE 4-CHAR CODE ===== */
  _generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  },

  /* ===== HOST: CREATE ROOM ===== */
  hostRoom() {
    const nameInput = document.getElementById('ul-host-name');
    const hostName = (nameInput && nameInput.value ? nameInput.value : '').trim() || 'Host';
    const roomCode = this._generateRoomCode();

    // Init game state
    this.currentGame.state.players = [{ id: 'host-1', name: hostName, connection: null }];
    this.currentGame.state.myName = hostName;
    this.currentGame.state.mode = 'online';

    Multiplayer.mode = 'internet';
    Multiplayer.createRoom(roomCode, hostName);

    // Show connecting screen
    Router.go('play');
    document.getElementById('play-game-name').textContent = this.currentGame.name + ' — Online';
    document.getElementById('play-content').innerHTML = `
      <div class="card" style="text-align:center; padding: 40px 10px;">
        <div class="card-label">Raum wird erstellt...</div>
        <h3>Bitte kurz warten.</h3>
      </div>
    `;
  },

  /* ===== GUEST: JOIN ROOM ===== */
  joinRoom() {
    const nameInput = document.getElementById('ul-guest-name');
    const codeInput = document.getElementById('ul-join-code');
    const guestName = (nameInput && nameInput.value ? nameInput.value : '').trim();
    const code = (codeInput && codeInput.value ? codeInput.value : '').trim().toUpperCase();

    if (!guestName) return alert('Bitte gib deinen Namen ein!');
    if (!code) return alert('Bitte gib den Raum-Code ein!');

    this.currentGame.state.myName = guestName;
    this.currentGame.state.mode = 'online';

    Multiplayer.mode = 'internet';
    Multiplayer.joinRoom(code);

    // Show connecting screen
    Router.go('play');
    document.getElementById('play-game-name').textContent = this.currentGame.name + ' — Online';
    document.getElementById('play-content').innerHTML = `
      <div class="card" style="text-align:center; padding: 40px 10px;">
        <div class="card-label">Verbinde...</div>
        <h3>Auf Host warten.</h3>
      </div>
    `;
  },

  /* ===== MULTIPLAYER CALLBACKS ===== */
  _wireCallbacks() {
    Multiplayer.onStatusChange = (status, msg) => this._handleStatus(status, msg);
    Multiplayer.onDataReceived = (data, conn) => this._handleData(data, conn);
    Multiplayer.onPlayerJoined = (conn) => { if (this.isInLobby) this._updateHostLobby(); };
    Multiplayer.onPlayerLeft = (conn) => {
      // Remove player from game state
      if (Multiplayer.role === 'host' && this.currentGame && this.currentGame.state) {
        this.currentGame.state.players = this.currentGame.state.players.filter(p => p.connection !== conn);
        if (this.isInLobby) this._updateHostLobby();
      }
    };
  },

  _handleStatus(status, msg) {
    if (status === 'connected') {
      if (Multiplayer.role === 'host') {
        if (this.isInLobby) this._updateHostLobby();
      } else if (Multiplayer.role === 'guest') {
        // Send join message to host
        Multiplayer.sendToHost({
          type: 'join',
          name: this.currentGame.state.myName,
          myId: Multiplayer.myId
        });
        // Show guest waiting screen
        this._renderGuestLobby();
      }
    } else if (status === 'error') {
      alert('Netzwerkfehler: ' + msg);
    }
  },

  _handleData(data, conn) {
    const game = this.currentGame;
    if (!game) return;

    // HOST receives data
    if (Multiplayer.role === 'host') {
      if (data.type === 'join') {
        // Add player if not already in list
        if (!game.state.players.find(p => p.id === data.myId)) {
          game.state.players.push({ id: data.myId, name: data.name, connection: conn });
          if (this.isInLobby) this._updateHostLobby();
          // Send updated player list and current state to all guests
          this._broadcastPlayerList();
        }
      } else if (data.type === 'name_change') {
        const player = game.state.players.find(p => p.id === data.myId);
        if (player) {
          player.name = data.name;
          if (this.isInLobby) this._updateHostLobby();
          this._broadcastPlayerList();
        }
      } else {
        // Forward game-specific data
        if (game.handleOnlineData) game.handleOnlineData(data, conn);
      }
    }
    // GUEST receives data
    else {
      if (data.type === 'player_list') {
        game.state.players = data.players.map(p => ({ id: p.id, name: p.name, connection: null }));
        this._renderGuestLobby();
      } else if (data.type === 'game_start') {
        // Host says go! Pass settings along
        if (game.onOnlineGameStart) {
          game.onOnlineGameStart(data.settings || {});
        }
      } else {
        // Forward game-specific data
        if (game.handleOnlineData) game.handleOnlineData(data, conn);
      }
    }
  },

  _broadcastPlayerList() {
    const game = this.currentGame;
    if (!game) return;
    Multiplayer.sendGameState({
      type: 'player_list',
      players: game.state.players.map(p => ({ id: p.id, name: p.name }))
    });
  },

  /* ===== HOST LOBBY UI ===== */
  _updateHostLobby() {
    this.isInLobby = true;
    if (Multiplayer.role !== 'host') return;
    const game = this.currentGame;

    // Game-specific HTML (packages, timer, etc.)
    let setupHTML = '';
    if (game.renderHostSetup) setupHTML = game.renderHostSetup();

    let playerListHTML = game.state.players.map(p => `
      <div style="background:var(--surface2); padding:10px 15px; border-radius:8px; margin-bottom:5px; font-weight:bold; display:flex; align-items:center; gap:8px;">
        <span>👤</span> ${p.name} ${p.id === 'host-1' ? '<span style="color:var(--primary); font-size:0.8em;">(Host)</span>' : ''}
      </div>
    `).join('');

    document.getElementById('play-content').innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="card-label">Raum-Code</div>
        <h1 style="color:var(--primary); font-size: 3rem; letter-spacing: 0.15em; font-family:'Abril Fatface', cursive; margin:10px 0;">${Multiplayer.hostId}</h1>
        <button id="ul-copy-btn" class="btn-primary" style="background:#ff3366; color:white; font-size:0.8rem; padding: 10px 25px; margin-bottom:10px; width: auto; border:none;" onclick="UnifiedLobby.copyRoomCode()">Kopieren 📋</button>
        <p style="color:var(--text-muted); font-size:0.85rem;">Teile diesen Code mit deinen Mitspielern</p>
      </div>
      <div class="card">
        <div class="card-label">${(game && game.name === 'Busfahrer' && game.state.cheatMode) ? '👤' : '👥'} Spieler (${game.state.players.length})</div>
        <div class="players-list">${playerListHTML}</div>
      </div>
      <div class="card">
        <div class="card-label">Dein Name</div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="ul-host-name-change" class="player-input" value="${game.state.myName}" style="flex:1;">
          <button class="btn-primary" style="white-space:nowrap;" onclick="UnifiedLobby._changeHostName()">✓ Ändern</button>
        </div>
      </div>
      ${setupHTML}
      <button class="btn-primary" style="margin-top:15px; font-size: 1.3rem; padding: 20px; width:100%;" onclick="UnifiedLobby._startGame()">🚀 Spiel starten</button>
    `;

    // Let the game do post-render work (e.g., rendering package toggles)
    if (game.onHostLobbyRendered) game.onHostLobbyRendered();
  },

  _changeHostName() {
    const input = document.getElementById('ul-host-name-change');
    const newName = (input && input.value ? input.value : '').trim();
    if (!newName) return;
    const game = this.currentGame;
    game.state.myName = newName;
    const hostPlayer = game.state.players.find(p => p.id === 'host-1');
    if (hostPlayer) hostPlayer.name = newName;
    this._updateHostLobby();
    this._broadcastPlayerList();
  },

  _startGame() {
    const game = this.currentGame;
    // Collect game-specific settings
    let settings = {};
    if (game.collectOnlineSettings) settings = game.collectOnlineSettings();

    // Broadcast start to all guests
    Multiplayer.sendGameState({ type: 'game_start', settings: settings });

    // Start game locally on host
    if (game.onOnlineGameStart) {
      this.isInLobby = false;
      game.onOnlineGameStart(settings);
    }
  },

  /* ===== GUEST LOBBY UI ===== */
  _renderGuestLobby() {
    const game = this.currentGame;

    let playerListHTML = '';
    if (game.state.players && game.state.players.length > 0) {
      playerListHTML = game.state.players.map(p => `
        <div style="background:var(--surface2); padding:10px 15px; border-radius:8px; margin-bottom:5px; font-weight:bold; display:flex; align-items:center; gap:8px;">
          <span>👤</span> ${p.name}
        </div>
      `).join('');
    } else {
      playerListHTML = '<div style="color:var(--text-muted);">Warte auf Spielerliste...</div>';
    }

    document.getElementById('play-content').innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="card-label">Verbunden mit Raum</div>
        <h1 style="color:var(--primary); font-size: 3rem; letter-spacing: 0.15em; font-family:'Abril Fatface', cursive; margin:10px 0;">${Multiplayer.hostId}</h1>
        <button id="ul-copy-btn" class="btn-primary" style="background:#ff3366; color:white; font-size:0.8rem; padding: 10px 25px; margin-bottom:10px; width: auto; border:none;" onclick="UnifiedLobby.copyRoomCode()">Kopieren 📋</button>
        <div style="color:var(--green); font-weight:bold;">✅ Verbunden</div>
      </div>
      <div class="card">
        <div class="card-label">Dein Name</div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="ul-guest-name-change" class="player-input" value="${game.state.myName}" style="flex:1;">
          <button class="btn-primary" style="white-space:nowrap;" onclick="UnifiedLobby._changeGuestName()">✓ Ändern</button>
        </div>
      </div>
      <div class="card">
        <div class="card-label">${(game && game.name === 'Busfahrer' && game.state.cheatMode) ? '👤' : '👥'} Spieler im Raum</div>
        <div class="players-list">${playerListHTML}</div>
      </div>
      <div class="card" style="text-align:center;">
        <h3 style="color:var(--text-muted);">⏳ Warte darauf, dass der Host das Spiel startet...</h3>
      </div>
    `;
  },

  _changeGuestName() {
    const input = document.getElementById('ul-guest-name-change');
    const newName = (input && input.value ? input.value : '').trim();
    if (!newName) return;
    this.currentGame.state.myName = newName;
    Multiplayer.sendToHost({
      type: 'name_change',
      myId: Multiplayer.myId,
      name: newName
    });
  }
};
</script>

  name: "Schuldspruch",
  tagline: "Wer würde am ehesten...?",
  color: "#ff3b30",
  shadow: "rgba(255, 59, 48, 0.4)",
  glow: "rgba(255, 59, 48, 0.2)",
  emoji: "👉",

  state: {
    mode: null,
    players: [],
    maxRounds: 5,
    voteTime: 15,
    activePackageIds: ['allgemein'],
    currentRound: 0,
    scores: {},
    phase: 'setup',
    currentQuestion: '',
    votes: {}, // playerId -> targetId (online)
    offlineVotes: {}, // index -> voteCount (offline)
    timeLeft: 0,
    timerInterval: null,
    questionPool: []
  },

  /* ================= UNIFIED LOBBY HOOKS ================= */
  collectOnlineSettings() {

      maxRounds: this.state.maxRounds,
      voteTime: this.state.voteTime,
      activePackageIds: [...this.state.activePackageIds]
    };
  },

  onOnlineGameStart(settings) {

    this.state.voteTime = parseInt(settings.voteTime) || 15;
    this.state.players = settings.players || [];
    this.state.activePackageIds = settings.activePackageIds || ['allgemein'];
    this.state.currentRound = 1;
    this.state.scores = {};
    this.state.players.forEach(p => this.state.scores[p.id] = 0);
    this.prepareQuestionPool();
    this.startNewOnlineRound();
  },

  handleOnlineData(data, conn) {
    if (Multiplayer.role !== 'host') {
        if (data.type === 'sync_state') {
            this.state = {...this.state, ...data.state};
            this.renderOnlineGame();
        } else if (data.type === 'return_lobby') {
            refreshLobby();
        }
        return;
    }

    // HOST Logic
    if (data.type === 'vote') {
        this.state.votes[data.playerId] = data.targetId;
        // Check if all voted
        if (Object.keys(this.state.votes).length >= this.state.players.length) {
            this.resolveOnlineRound();
        } else {
            this.broadcastState();
            this.renderOnlineGame();

  },

  prepareQuestionPool() {
    this.state.questionPool = [];
    this.state.activePackageIds.forEach(pid => {
        const pkg = SchuldspruchPackages.find(p => p.id === pid);
        if (pkg) this.state.questionPool.push(...pkg.tasks);
    });
    this.shuffleArray(this.state.questionPool);
  },

  setupOffline() {
    this.state.mode = 'offline';
    this.state.players = ['Spieler 1', 'Spieler 2', 'Spieler 3'];
    this.state.maxRounds = 5;
    this.state.activePackageIds = ['allgemein'];
    this.renderOfflineSetup();
  },

  renderOfflineSetup() {
    document.getElementById('setup-content').innerHTML = `
      <div class="card">
        <div class="card-label">👥 Spieler (Min. 3)</div>
        <div class="players-list" id="fz-players-list"></div>
        <button class="btn-primary" style="background:var(--surface2); color:var(--text); margin-top:10px; font-size: 0.9rem;" onclick="Schuldspruch.addOfflinePlayer()">＋ Spieler hinzufügen</button>
      </div>

      <div class="card">
        <div class="card-label">📦 Kategorien</div>
        <div id="fz-pkg-grid"></div>
      </div>

      <div class="card">
        <div class="card-label">⏱️ Rundenanzahl</div>
        <div style="display:flex; align-items:center; gap:10px;">
           <input type="range" class="styled-range" min="1" max="21" step="1" value="${this.state.maxRounds > 20 ? 21 : this.state.maxRounds}" 
             style="--pct: ${(( (this.state.maxRounds > 20 ? 21 : this.state.maxRounds) - 1) / (21 - 1)) * 100}%"
             oninput="
               const val = parseInt(this.value);
               document.getElementById('fz-rounds-val').textContent = val > 20 ? 'Endlos' : val; 
               Schuldspruch.state.maxRounds = val > 20 ? 999 : val;
               this.style.setProperty('--pct', ((val - this.min) / (this.max - this.min)) * 100 + '%');
             ">
           <span id="fz-rounds-val" style="font-weight:bold; width: 60px; text-align:right;">${this.state.maxRounds > 20 ? 'Endlos' : this.state.maxRounds}</span>
        </div>
      </div>

      <button class="btn-primary" onclick="Schuldspruch.startOfflineGame()">🚀 Weiter</button>
    `;
    this.renderOfflinePlayersList();
    this.renderPackages('fz-pkg-grid');
  },

  renderOfflinePlayersList() {
    const list = document.getElementById('fz-players-list');
    if (!list) return;
    list.innerHTML = this.state.players.map((p, i) => `
      <div style="display:flex; gap:10px; margin-bottom:8px;">
        <input type="text" class="player-input" value="${p}" onchange="Schuldspruch.updateOfflinePlayer(${i}, this.value)">
        ${this.state.players.length > 3 ? `<button class="btn-icon" onclick="Schuldspruch.removeOfflinePlayer(${i})">✕</button>` : ''}
      </div>
    `).join('');
  },

  addOfflinePlayer() {
    this.state.players.push(`Spieler ${this.state.players.length + 1}`);
    this.renderOfflinePlayersList();
  },

  removeOfflinePlayer(idx) {
    if (this.state.players.length <= 3) return;
    this.state.players.splice(idx, 1);
    this.renderOfflinePlayersList();
  },

  updateOfflinePlayer(idx, val) {
    if (val.trim()) this.state.players[idx] = val.trim();
  },

  renderPackages(containerId) {
    PackageManager.renderGrid({
        namespace: 'Schuldspruch',
        targetId: containerId,
        packages: SchuldspruchPackages,
        activeIds: this.state.activePackageIds,
        isMulti: true,
        countSuffix: 'Fragen',
        onToggle: (id) => {
            if (this.state.activePackageIds.includes(id)) {
                if (this.state.activePackageIds.length <= 1) return alert("Mindestens ein Paket muss aktiv sein!");
                this.state.activePackageIds = this.state.activePackageIds.filter(pid => pid !== id);
            } else {
                this.state.activePackageIds.push(id);
            }
            this.renderPackages(containerId);
            if (this.state.mode === 'online' && Multiplayer.role === 'host') {
                refreshLobby(); 
            }
        }
    });
  },

  /* ================= OFFLINE GAME ================= */
  startOfflineGame() {
    this.state.currentRound = 1;
    this.state.scores = {};
    this.state.players.forEach((_, i) => this.state.scores[i] = 0);
    this.prepareQuestionPool();
    this.startNewOfflineRound();
  },

  startNewOfflineRound() {
    this.state.phase = 'voting';
    if (this.state.questionPool.length === 0) this.prepareQuestionPool(); // reshuffle if empty
    this.state.currentQuestion = this.state.questionPool.pop();
    this.state.offlineVotes = {};
    this.state.players.forEach((_, i) => this.state.offlineVotes[i] = 0);
    
    Router.go('play');
    document.getElementById('play-game-name').textContent = 'Schuldspruch';
    this.renderOfflineGame();
  },

  renderOfflineGame() {
    const s = this.state;
    if (s.phase === 'results') return this.renderResults();

    let ht = '';
    if (s.phase === 'voting') {
        ht = `
          <div style="font-size:0.75rem; background:var(--surface2); padding:4px 10px; border-radius:10px; margin-bottom:8px; display:inline-block;">
            Runde <b>${s.currentRound}</b> ${s.maxRounds > 20 ? '' : ` / ${s.maxRounds}`}
          </div>
          <div class="card" style="text-align:center; padding: 25px 15px; margin-bottom:15px; background:var(--primary-dim); border: 2px solid var(--primary);">
            <h2 style="font-size:1.6rem; line-height:1.3; margin:0;">Wer würde am ehesten ${s.currentQuestion}?</h2>
            ${s.maxRounds > 20 ? `<button class="btn-primary" style="background:var(--primary); color:#fff; font-size:0.8rem; margin-top:20px; padding:5px 10px; width:auto;" onclick="Schuldspruch.renderResults()">Spiel beenden</button>` : ''}
          </div>
          <p style="text-align:center; color:var(--text-muted); margin-bottom:15px; font-size:0.9rem;">Sammelt die Stimmen aller Spieler. Gebt dazu das Handy weiter oder tippt gemeinsam ab.</p>
          <div style="display:flex; flex-direction:column; gap:10px;">
            ${s.players.map((p, i) => `
                <div style="background:var(--surface2); border-radius:10px; padding:10px 15px; display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:bold; font-size:1.1rem;">${p}</span>
                    <div style="display:flex; align-items:center; gap:15px;">
                        <span style="font-size:1.2rem; min-width:30px; text-align:center;">${s.offlineVotes[i]}</span>
                        <button class="btn-primary" style="margin:0; width:50px; font-size:1.5rem; background:var(--primary); color:#fff; padding:5px;" onclick="Schuldspruch.addOfflineVote(${i})">+1</button>
                    </div>
                </div>
            `).join('')}
          </div>
          <button class="btn-primary" style="margin-top:25px;" onclick="Schuldspruch.resolveOfflineRound()">Auswertung</button>
        `;
    } else if (s.phase === 'round_result') {
        // Find winners
        let maxVotes = -1;
        let winners = [];
        Object.keys(s.offlineVotes).forEach(i => {
            if (s.offlineVotes[i] > maxVotes) {
               maxVotes = s.offlineVotes[i];
               winners = [s.players[i]];
            } else if (s.offlineVotes[i] === maxVotes) {
               winners.push(s.players[i]);
            }
        });

        ht = `
          <div class="card" style="text-align:center; padding: 40px 20px;">
            <h2 style="color:var(--text-muted); font-size:1rem; margin-bottom:10px;">Auswertung</h2>
            <h3 style="font-size:1.6rem; margin-bottom:30px; line-height:1.3;">Wer würde am ehesten ${s.currentQuestion}?</h3>
            
            <div style="font-size:clamp(3rem, 15vw, 4rem); margin-bottom:10px;">👇</div>
            <div style="font-size:clamp(1.8rem, 8vw, 2.5rem); font-weight:bold; color:var(--primary); line-height:1.1; margin-bottom:10px;">
               ${maxVotes > 0 ? winners.join(' & ') : 'Niemand'}
            </div>
            <p style="color:var(--text-muted); margin-bottom:30px;">mit ${maxVotes} Stimmen</p>
            
            <button class="btn-primary" onclick="Schuldspruch.nextRoundOffline()">Weiter (${s.currentRound}/${s.maxRounds})</button>
          </div>
        `;
    }
    
    document.getElementById('play-content').innerHTML = ht;
  },

  addOfflineVote(idx) {
      this.state.offlineVotes[idx]++;
      this.renderOfflineGame();
  },

  resolveOfflineRound() {
      // Find winners and distribute points
      let maxVotes = -1;
      let winners = [];
      Object.keys(this.state.offlineVotes).forEach(i => {
          if (this.state.offlineVotes[i] > maxVotes) {
             maxVotes = this.state.offlineVotes[i];
             winners = [i];
          } else if (this.state.offlineVotes[i] === maxVotes) {
             winners.push(i);
          }
      });

      if (maxVotes > 0) {
          winners.forEach(i => {
              this.state.scores[i]++;
          });
      }

      this.state.phase = 'round_result';
      this.renderOfflineGame();
  },

  nextRoundOffline() {
      if (this.state.currentRound >= this.state.maxRounds) {
          this.state.phase = 'results';
          this.renderResults();
      } else {
          this.state.currentRound++;
          this.startNewOfflineRound();
      }
  },

  /* ================= ONLINE SPECIFIC ================= */
  renderHostSetup() {
    return `
      <div class="card">
        <div class="card-label">📦 Kategorien</div>
        <div id="fz-pkg-grid-on"></div>
      </div>
      <div class="card">
        <div class="card-label">⏱️ Rundenanzahl</div>
        <div style="display:flex; align-items:center; gap:10px;">
           <input type="range" class="styled-range" min="1" max="21" step="1" value="${this.state.maxRounds > 20 ? 21 : this.state.maxRounds}" 
             style="--pct: ${(( (this.state.maxRounds > 20 ? 21 : this.state.maxRounds) - 1) / (21 - 1)) * 100}%"
             oninput="
               const val = parseInt(this.value);
               document.getElementById('fz-rounds-val-on').textContent = val > 20 ? 'Endlos' : val; 
               Schuldspruch.state.maxRounds = val > 20 ? 999 : val;
               this.style.setProperty('--pct', ((val - this.min) / (this.max - this.min)) * 100 + '%');
             ">
           <span id="fz-rounds-val-on" style="font-weight:bold; width: 60px; text-align:right;">${this.state.maxRounds > 20 ? 'Endlos' : this.state.maxRounds}</span>
        </div>
      </div>
      <div class="card">
        <div class="card-label">⏳ Zeit für Abstimmung (Sekunden)</div>
        <div style="display:flex; align-items:center; gap:10px;">
           <input type="range" class="styled-range" min="5" max="60" step="5" value="${this.state.voteTime}" 
             style="--pct: ${((this.state.voteTime - 5) / (60 - 5)) * 100}%"
             oninput="
               document.getElementById('fz-time-val-on').textContent = this.value; 
               Schuldspruch.state.voteTime = parseInt(this.value);
               this.style.setProperty('--pct', ((this.value - this.min) / (this.max - this.min)) * 100 + '%');
             ">
           <span id="fz-time-val-on" style="font-weight:bold; width: 30px; text-align:right;">${this.state.voteTime}</span>
        </div>
      </div>
    `;
  },

  onHostLobbyRendered() {
    this.renderPackages('fz-pkg-grid-on');
  },

  startNewOnlineRound() {
      this.state.phase = 'voting';
      if (this.state.questionPool.length === 0) this.prepareQuestionPool();
      this.state.currentQuestion = this.state.questionPool.pop();
      this.state.votes = {};
      this.state.timeLeft = this.state.voteTime;
      
      this.broadcastState();
      
      Router.go('play');
      document.getElementById('play-game-name').textContent = 'Schuldspruch';
      this.renderOnlineGame();

      // Start timer
      clearInterval(this.state.timerInterval);
      this.state.timerInterval = setInterval(() => {
          this.state.timeLeft--;
          if (this.state.timeLeft <= 0) {
              clearInterval(this.state.timerInterval);
              this.resolveOnlineRound();
          } else {
              this.broadcastState(); // send updated time
              this.renderOnlineGame();
          }
      }, 1000);
  },

  broadcastState() {
      Multiplayer.sendGameState({
          type: 'sync_state',
          state: {
              phase: this.state.phase,
              currentQuestion: this.state.currentQuestion,
              scores: this.state.scores,
              currentRound: this.state.currentRound,
              players: this.state.players.map(p => ({ id: p.id, name: p.name })),
              timeLeft: this.state.timeLeft,
              votes: this.state.votes,
              maxRounds: this.state.maxRounds
          }
      });
  },

  renderOnlineGame() {
      const s = this.state;
      if (s.phase === 'results') return this.renderResults();

      const isHost = (typeof Multiplayer !== 'undefined' && Multiplayer.role === 'host') || (typeof SharedRoom !== 'undefined' && SharedRoom.isActive && SharedRoom.isLocalHost);
      const myId = isHost ? 'host-1' : (typeof Multiplayer !== 'undefined' ? Multiplayer.myId : null);
      const iVoted = !!s.votes[myId];

      let ht = '';
      if (s.phase === 'voting') {
          ht = `
            <div style="font-size:0.75rem; background:var(--surface2); padding:4px 10px; border-radius:10px; margin-bottom:8px; display:inline-block;">
              Runde <b>${s.currentRound}</b> ${s.maxRounds > 20 ? '' : ` / ${s.maxRounds}`}
            </div>
            <div class="card" style="text-align:center; padding: 25px 15px; margin-bottom:15px; background:var(--primary-dim); border: 2px solid var(--primary);">
              <h2 style="font-size:1.6rem; line-height:1.3; margin:0;">Wer würde am ehesten ${s.currentQuestion}?</h2>
              ${s.maxRounds > 20 && ((typeof Multiplayer !== 'undefined' && Multiplayer.role === 'host') || (typeof SharedRoom !== 'undefined' && SharedRoom.isActive && SharedRoom.isLocalHost)) ? `<button class="btn-primary" style="background:var(--primary); color:#fff; font-size:0.8rem; margin-top:15px; padding:5px 10px; width:auto;" onclick="Schuldspruch.renderResults()">Spiel beenden</button>` : ''}
            </div>
            
            <div style="text-align:center; margin-bottom:20px; font-weight:bold; color:var(--primary); font-size:1.5rem;">
               ⏱️ ${s.timeLeft}s
            </div>

            ${!iVoted ? `
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:10px;">
                    ${s.players.map(p => `
                        <div style="background:var(--surface); border:1px solid var(--border); padding:20px; text-align:center; border-radius:15px; cursor:pointer;" onclick="Schuldspruch.submitOnlineVote('${p.id}')">
                           <div style="font-size:1.2rem; font-weight:bold;">${p.name}</div>
                        </div>
                    `).join('')}
                </div>
            ` : `
                <div class="card" style="text-align:center; padding:30px 20px;">
                    <div style="font-size:clamp(2rem, 8vw, 3rem); margin-bottom:10px;">✅</div>
                    <h3>Stimme abgegeben!</h3>
                    <p style="color:var(--text-muted);">Warte auf die anderen Spieler...</p>
                    <p style="margin-top:10px;">${Object.keys(s.votes).length} / ${s.players.length} haben abgestimmt.</p>
                </div>
            `}
          `;
      } else if (s.phase === 'round_result') {
          // Calculate max votes from s.votes
          let voteCounts = {};
          s.players.forEach(p => voteCounts[p.id] = 0);
          Object.values(s.votes).forEach(targetId => {
              if (voteCounts[targetId] !== undefined) voteCounts[targetId]++;
          });
          
          let maxVotes = -1;
          let winners = [];
          Object.keys(voteCounts).forEach(id => {
              if (voteCounts[id] > maxVotes) {
                 maxVotes = voteCounts[id];
                 winners = [s.players.find(p=>p.id===id).name];
              } else if (voteCounts[id] === maxVotes) {
                 winners.push(s.players.find(p=>p.id===id).name);
              }
          });

          ht = `
            <div class="card" style="text-align:center; padding: 40px 20px;">
              <h2 style="color:var(--text-muted); font-size:1rem; margin-bottom:10px;">Auswertung</h2>
              <h3 style="font-size:1.6rem; margin-bottom:30px; line-height:1.3;">Wer würde am ehesten ${s.currentQuestion}?</h3>
              
              <div style="font-size:clamp(3rem, 15vw, 4rem); margin-bottom:10px;">👇</div>
              <div style="font-size:clamp(1.8rem, 8vw, 2.5rem); font-weight:bold; color:var(--primary); line-height:1.1; margin-bottom:10px;">
                 ${maxVotes > 0 ? winners.join(' & ') : 'Niemand'}
              </div>
              <p style="color:var(--text-muted); margin-bottom:30px;">mit ${maxVotes} Stimmen</p>
              
               ${Multiplayer.role === 'host' ? `
                    <div style="display:flex; gap:10px; justify-content:center;">
                      <button class="btn-primary" onclick="Schuldspruch.nextRoundOnline()">Weiter (${s.currentRound}/${s.maxRounds})</button>
                      <button class="btn-primary" style="background:var(--surface2); color:var(--text); width:auto;" onclick="Schuldspruch.returnToLobby()">Lobby</button>
                    </div>
               ` : '<p style="color:var(--text-muted);">Warte auf den Host...</p>'}
             </div>
           `;
      }
      
      document.getElementById('play-content').innerHTML = ht;
  },

  submitOnlineVote(targetId) {
      const myId = Multiplayer.role === 'host' ? 'host-1' : Multiplayer.myId;
      if (Multiplayer.role === 'host') {
          this.handleOnlineData({ type: 'vote', playerId: myId, targetId: targetId });
      } else {
          Multiplayer.sendToHost({ type: 'vote', playerId: myId, targetId: targetId });
          // Optimistic local update
          this.state.votes[myId] = targetId;
          this.renderOnlineGame();
      }
  },

  resolveOnlineRound() {
      clearInterval(this.state.timerInterval);
      
      // Tally votes
      let voteCounts = {};
      this.state.players.forEach(p => voteCounts[p.id] = 0);
      Object.values(this.state.votes).forEach(targetId => {
          if (voteCounts[targetId] !== undefined) voteCounts[targetId]++;
      });
      
      let maxVotes = -1;
      let winners = [];
      Object.keys(voteCounts).forEach(id => {
          if (voteCounts[id] > maxVotes) {
             maxVotes = voteCounts[id];
             winners = [id];
          } else if (voteCounts[id] === maxVotes) {
             winners.push(id);
          }
      });

      if (maxVotes > 0) {
          winners.forEach(id => {
              this.state.scores[id]++;
          });
      }

      this.state.phase = 'round_result';
      this.broadcastState();
      this.renderOnlineGame();
  },

  nextRoundOnline() {
      if (this.state.currentRound >= this.state.maxRounds) {
          this.state.phase = 'results';
          this.broadcastState();
          this.renderResults();
      } else {
          this.state.currentRound++;
          this.startNewOnlineRound();
      }
  },

  /* ================= RESULTS ================= */
  renderResults() {
    clearInterval(this.state.timerInterval);
    this.state.phase = 'results';
    const s = this.state;
    let winners = [];
    let maxScore = -1;
    
    if (this.state.mode === 'online') {
        s.players.forEach(p => {
            if (s.scores[p.id] > maxScore) {
                maxScore = s.scores[p.id];
                winners = [p.name];
            } else if (s.scores[p.id] === maxScore) {
                winners.push(p.name);
            }
        });
    } else {
        s.players.forEach((name, i) => {
            if (s.scores[i] > maxScore) {
                maxScore = s.scores[i];
                winners = [name];
            } else if (s.scores[i] === maxScore) {
                winners.push(name);
            }
        });
    }

    document.getElementById('play-content').innerHTML = `
      <div class="card" style="text-align:center; padding:50px 20px;">
        <h1 style="font-size:clamp(2.2rem, 10vw, 3.5rem); margin-bottom:10px; font-family:'Abril Fatface', cursive;">🏆 Sieg!</h1>
        <h2 style="color:var(--primary); margin-bottom:40px; font-size:2rem;">${winners.join(' & ')}</h2>
        
        <div class="card-label">Finale Punkte</div>
        <div style="background:var(--surface2); padding:20px; border-radius:15px; margin-bottom:40px;">
            ${(this.state.mode === 'online' ? s.players.map(p => `
                <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                    <span>${p.name}</span>
                    <b style="color:var(--secondary)">${s.scores[p.id]} Pkt.</b>
                </div>
            `) : s.players.map((name, i) => `
                <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                    <span>${name}</span>
                    <b style="color:var(--secondary)">${s.scores[i]} Pkt.</b>
                </div>
            `)).join('')}
        </div>
        
        ${this.state.mode === 'online' && Multiplayer.role === 'host' ? `
            <button class="btn-primary" onclick="Schuldspruch.startNewOnlineRound(); Schuldspruch.state.currentRound=1; Schuldspruch.state.scores={}; Schuldspruch.state.players.forEach(p=>Schuldspruch.state.scores[p.id]=0);">Nochmal spielen</button>
        ` : ''}
        ${this.state.mode === 'offline' ? `
            <button class="btn-primary" onclick="Schuldspruch.startOfflineGame()">Nochmal spielen</button>
        ` : ''}

        <button class="btn-primary" style="background:var(--surface2); color:var(--text); margin-top:10px;" onclick="Schuldspruch.open()">Hauptmenü</button>
        ${this.state.mode === 'online' ? `<button class="btn-primary" style="background:var(--surface2); color:var(--text); margin-top:10px;" onclick="Schuldspruch.returnToLobby()">Lobby</button>` : ''}
      </div>
    `;

    if (this.state.mode === 'online' && Multiplayer.role === 'host') {
        this.broadcastState();
    }
  },

  returnToLobby() {
    if (this.state.mode === 'offline') {
        this.open();
    } else {
        if (Multiplayer.role === 'host') {
            Multiplayer.sendGameState({ type: 'return_lobby' });
            refreshLobby();
        } else {
            refreshLobby();
        }
    }
  },

  returnToLobby() {
    if (Multiplayer.role === 'host') {
      hostReturnToLobby();
    }
  },

  /* ================= HELPERS ================= */
  shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
  }
};

</script>
<script>
/* === shared-room.js === */
/* ===================================================
   SharedRoom — Persistenter Multiplayer-Raum
   Spieler können den Raum betreten und darin das Spiel
   wechseln ohne neu verbinden zu müssen.
   =================================================== */

const SharedRoom = {
  isActive: false,
  selectedGameId: null,    // ID of the game currently selected by host
  isInLobby: false,
  isLocalHost: false,

  /* ===== ENTRY POINT ===== */
  open() {
    this.isActive = true;
    this.isInLobby = false;
    this.selectedGameId = GAMES.find(g => g.supportsOnline !== false)?.id || null;

    this._wireCallbacks();

    Router.go('setup');
    document.getElementById('setup-title').textContent = '🏠 Gemeinsamer Raum';
    document.getElementById('setup-content').innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="card-label">🏠 Raum erstellen</div>
        <input type="text" id="sr-host-name" class="player-input" placeholder="Dein Name" value="Host" style="margin-bottom:15px;">
        <button class="btn-primary" onclick="SharedRoom.hostRoom()">Raum erstellen</button>
      </div>
      <div class="card" style="text-align:center;">
        <div class="card-label">🔑 Raum beitreten</div>
        <input type="text" id="sr-guest-name" class="player-input" placeholder="Dein Name" value="" style="margin-bottom:10px;">
        <input type="text" id="sr-join-code" class="player-input" placeholder="Raum-Code (z.B. AB12)" style="margin-bottom:15px; text-transform:uppercase;">
        <button class="btn-primary" onclick="SharedRoom.joinRoom()">Beitreten</button>
      </div>
    `;
  },

  _generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  },

  /* ===== STATE ===== */
  state: {
    players: [],
    myName: 'Host',
    mode: 'online'
  },

  /* ===== HOST ===== */
  hostRoom() {
    const nameInput = document.getElementById('sr-host-name');
    const hostName = (nameInput?.value || '').trim() || 'Host';
    const roomCode = this._generateRoomCode();

    this.state.players = [{ id: 'host-1', name: hostName, connection: null, isHost: true }];
    this.state.myName = hostName;
    this.state.mode = 'online';
    this.isLocalHost = true;
    this.selectedGameId = GAMES.find(g => g.supportsOnline !== false)?.id || null;

    Multiplayer.mode = 'internet';
    Multiplayer.createRoom(roomCode, hostName);

    Router.go('play');
    document.getElementById('play-game-name').textContent = '🏠 Gemeinsamer Raum';
    document.getElementById('play-content').innerHTML = `
      <div class="card" style="text-align:center; padding:40px 10px;">
        <div class="card-label">Raum wird erstellt...</div>
        <h3>Bitte kurz warten.</h3>
      </div>
    `;
  },

  /* ===== GUEST ===== */
  joinRoom() {
    const nameInput = document.getElementById('sr-guest-name');
    const codeInput = document.getElementById('sr-join-code');
    const guestName = (nameInput?.value || '').trim();
    const code = (codeInput?.value || '').trim().toUpperCase();

    if (!guestName) return alert('Bitte gib deinen Namen ein!');
    if (!code) return alert('Bitte gib den Raum-Code ein!');

    this.state.myName = guestName;
    this.state.mode = 'online';
    this.isLocalHost = false;

    Multiplayer.mode = 'internet';
    Multiplayer.joinRoom(code);

    Router.go('play');
    document.getElementById('play-game-name').textContent = '🏠 Gemeinsamer Raum';
    document.getElementById('play-content').innerHTML = `
      <div class="card" style="text-align:center; padding:40px 10px;">
        <div class="card-label">Verbinde...</div>
        <h3>Auf Host warten.</h3>
      </div>
    `;
  },

  /* ===== CALLBACKS ===== */
  _wireCallbacks() {
    Multiplayer.onStatusChange = (status, msg) => this._handleStatus(status, msg);
    Multiplayer.onDataReceived = (data, conn) => this._handleData(data, conn);
    Multiplayer.onPlayerJoined = (conn) => { if (this.isInLobby) this._renderHostLobby(); };
    Multiplayer.onPlayerLeft = (conn) => {
      this.state.players = this.state.players.filter(p => p.connection !== conn);
      if (this.isInLobby) this._renderHostLobby();
    };
  },

  _handleStatus(status, msg) {
    if (status === 'connected') {
      if (Multiplayer.role === 'host') {
        this.isInLobby = true;
        this._renderHostLobby();
      } else {
        Multiplayer.sendToHost({
          type: 'sr_join',
          name: this.state.myName,
          myId: Multiplayer.myId
        });
        this._renderGuestLobby({ players: [], selectedGameId: null });
      }
    } else if (status === 'error') {
      alert('Netzwerkfehler: ' + msg);
    }
  },

  _handleData(data, conn) {
    // Intercept return to lobby messages
    if (data.type === 'return_lobby' || data.type === 'back_to_lobby' || data.type === 'sr_return_to_lobby') {
      this.isInLobby = true;
      if (Multiplayer.role === 'host') {
        this._renderHostLobby();
      } else {
        this._renderGuestLobby({ players: this.state.players, selectedGameId: this.selectedGameId });
      }
      return;
    }

    if (Multiplayer.role === 'host') {
      if (data.type === 'sr_join') {
        if (!this.state.players.find(p => p.id === data.myId)) {
          this.state.players.push({ id: data.myId, name: data.name, connection: conn, isHost: false });
          if (typeof Multiplayer !== 'undefined') {
            Multiplayer.players = this.state.players.map(p => ({ id: p.id, name: p.name }));
          }
          if (this.isInLobby) this._renderHostLobby();
          this._broadcastLobbyState();
        }
      } else if (data.type === 'sr_name_change') {
        const p = this.state.players.find(p => p.id === data.myId);
        if (p) { p.name = data.name; if (this.isInLobby) this._renderHostLobby(); this._broadcastLobbyState(); }
      } else {
        // Forward game-specific data to the active module
        const gameWrapper = GAMES.find(g => g.id === this.selectedGameId);
        if (gameWrapper && gameWrapper.module && gameWrapper.module.handleOnlineData) {
          gameWrapper.module.handleOnlineData(data, conn);
        }
      }
    } else {
      if (data.type === 'sr_lobby_state') {
        this.selectedGameId = data.selectedGameId;
        this.state.players = data.players.map(p => ({ id: p.id, name: p.name, isHost: p.isHost, connection: null }));
        this._renderGuestLobby(data);
      } else if (data.type === 'sr_game_start') {
        this.selectedGameId = data.gameId;
        const gameWrapper = GAMES.find(g => g.id === data.gameId);
        if (!gameWrapper) return;
        const gameModule = gameWrapper.module;
        if (!gameModule) return;

        // Patch game state with our player info
        if (!gameModule.state) gameModule.state = {};
        gameModule.state.players = data.players;
        gameModule.state.myName = this.state.myName;
        gameModule.state.mode = 'online';
        this.isInLobby = false;

        const settings = data.settings || {};
        settings.players = data.players;

        if (gameModule.onOnlineGameStart) {
          gameModule.onOnlineGameStart(settings);
        }
      } else if (data.type === 'sr_return_to_lobby') {
        // Host returned everyone to the shared lobby after a game
        this.isInLobby = true;
        this._renderGuestLobby({ players: this.state.players, selectedGameId: this.selectedGameId });
      } else {
        // Forward game-specific data to the active module
        const gameWrapper = GAMES.find(g => g.id === this.selectedGameId);
        if (gameWrapper && gameWrapper.module && gameWrapper.module.handleOnlineData) {
          gameWrapper.module.handleOnlineData(data, conn);
        }
      }
    }
  },

  _broadcastLobbyState() {
    Multiplayer.sendGameState({
      type: 'sr_lobby_state',
      players: this.state.players.map(p => ({ id: p.id, name: p.name, isHost: p.isHost || false })),
      selectedGameId: this.selectedGameId
    });
  },

  /* ===== HOST LOBBY ===== */
  _renderHostLobby() {
    this.isInLobby = true;
    const onlineGames = GAMES.filter(g => g.supportsOnline !== false);
    const gameWrapper = onlineGames.find(g => g.id === this.selectedGameId) || onlineGames[0];
    this.selectedGameId = gameWrapper?.id;
    const gameModule = gameWrapper?.module;

    let setupHTML = '';
    if (gameModule && gameModule.renderHostSetup) setupHTML = gameModule.renderHostSetup();

    const playerListHTML = this.state.players.map(p => `
      <div style="background:var(--surface2); padding:10px 15px; border-radius:8px; margin-bottom:5px; font-weight:bold; display:flex; align-items:center; gap:8px;">
        <span>${p.isHost ? '👑' : '👤'}</span> ${p.name} ${p.isHost ? '<span style="color:var(--primary); font-size:0.8em;">(Host)</span>' : ''}
      </div>
    `).join('');

    const gameOptionsHTML = onlineGames.map(g => `
      <option value="${g.id}" ${g.id === this.selectedGameId ? 'selected' : ''}>${g.emoji} ${g.name}</option>
    `).join('');

    document.getElementById('play-game-name').textContent = '🏠 Gemeinsamer Raum';
    document.getElementById('play-content').innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="card-label">Raum-Code</div>
        <h1 style="color:var(--primary); font-size:3rem; letter-spacing:0.15em; font-family:'Abril Fatface',cursive; margin:10px 0;">${Multiplayer.hostId}</h1>
        <button class="btn-primary" style="background:#ff3366; color:white; font-size:0.8rem; padding:10px 25px; margin-bottom:10px; width:auto; border:none; transition: all 0.3s;" onclick="SharedRoom.copyCode(this)">Kopieren 📋</button>
      </div>
      <div class="card">
        <div class="card-label">👥 Spieler (${this.state.players.length})</div>
        <div class="players-list">${playerListHTML}</div>
      </div>
      <div class="card">
        <div class="card-label">Dein Name</div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="sr-host-name-change" class="player-input" value="${this.state.myName}" style="flex:1;">
          <button class="btn-primary" style="white-space:nowrap;" onclick="SharedRoom._changeHostName()">✓ Ändern</button>
        </div>
      </div>
      <div class="card">
        <div class="card-label">🎮 Spiel auswählen</div>
        <select id="sr-game-select" class="input-field" style="width:100%; padding:12px; border-radius:8px; background:var(--bg-card); border:1px solid var(--border); color:var(--text); font-size:1rem; margin-bottom:0.5rem;" onchange="SharedRoom._onGameChange(this.value)">
          ${gameOptionsHTML}
        </select>
      </div>
      ${setupHTML}
      <button class="btn-primary" style="margin-top:15px; font-size:1.3rem; padding:20px; width:100%;" onclick="SharedRoom._startGame()">🚀 Spiel starten</button>
    `;

    if (gameModule && gameModule.onHostLobbyRendered) gameModule.onHostLobbyRendered();
  },

  _onGameChange(gameId) {
    this.selectedGameId = gameId;
    this._broadcastLobbyState();
    this._renderHostLobby();
  },

  _changeHostName() {
    const input = document.getElementById('sr-host-name-change');
    const newName = (input?.value || '').trim();
    if (!newName) return;
    this.state.myName = newName;
    const hostPlayer = this.state.players.find(p => p.id === 'host-1');
    if (hostPlayer) hostPlayer.name = newName;
    this._renderHostLobby();
    this._broadcastLobbyState();
  },

  _startGame() {
    const gameWrapper = GAMES.find(g => g.id === this.selectedGameId);
    if (!gameWrapper) return alert('Kein Spiel ausgewählt!');
    const gameModule = gameWrapper.module;
    if (!gameModule) return alert('Spielmodul nicht geladen!');

    let settings = {};
    if (gameModule.collectOnlineSettings) settings = gameModule.collectOnlineSettings();

    // Patch game state
    if (!gameModule.state) gameModule.state = {};
    gameModule.state.players = this.state.players.map(p => ({ id: p.id, name: p.name, isHost: p.isHost, connection: p.connection }));
    gameModule.state.myName = this.state.myName;
    gameModule.state.mode = 'online';

    // Broadcast to guests
    const cleanPlayers = this.state.players.map(p => ({ id: p.id, name: p.name, isHost: p.isHost || false }));
    settings.players = cleanPlayers;
    
    if (typeof Multiplayer !== 'undefined') {
      Multiplayer.players = cleanPlayers;
    }

    Multiplayer.sendGameState({
      type: 'sr_game_start',
      gameId: this.selectedGameId,
      settings: settings,
      players: cleanPlayers
    });

    this.isInLobby = false;

    // Host also starts the game
    if (gameModule.onOnlineGameStart) {
      gameModule.onOnlineGameStart(settings);
    }
  },

  /* ===== GUEST LOBBY ===== */
  _renderGuestLobby(data = {}) {
    const players = data.players || this.state.players || [];
    const gameId = data.selectedGameId || this.selectedGameId;
    const selectedGame = GAMES.find(g => g.id === gameId);
    const gameName = selectedGame ? `${selectedGame.emoji} ${selectedGame.name}` : 'Kein Spiel ausgewählt';

    const playerListHTML = players.length > 0
      ? players.map(p => `
          <div style="background:var(--surface2); padding:10px 15px; border-radius:8px; margin-bottom:5px; font-weight:bold; display:flex; align-items:center; gap:8px;">
            <span>${p.isHost ? '👑' : '👤'}</span> ${p.name}
          </div>
        `).join('')
      : '<div style="color:var(--text-muted);">Warte auf Spielerliste...</div>';

    document.getElementById('play-game-name').textContent = '🏠 Gemeinsamer Raum';
    document.getElementById('play-content').innerHTML = `
      <div class="card" style="text-align:center;">
        <div class="card-label">Verbunden mit Raum</div>
        <h1 style="color:var(--primary); font-size:3rem; letter-spacing:0.15em; font-family:'Abril Fatface',cursive; margin:10px 0;">${Multiplayer.hostId}</h1>
        <div style="color:var(--green); font-weight:bold;">✅ Verbunden</div>
      </div>
      <div class="card">
        <div class="card-label">Dein Name</div>
        <div style="display:flex; gap:8px;">
          <input type="text" id="sr-guest-name-change" class="player-input" value="${this.state.myName}" style="flex:1;">
          <button class="btn-primary" style="white-space:nowrap;" onclick="SharedRoom._changeGuestName()">✓ Ändern</button>
        </div>
      </div>
      <div class="card">
        <div class="card-label">👥 Spieler im Raum</div>
        <div class="players-list">${playerListHTML}</div>
      </div>
      <div class="card" style="text-align:center;">
        <div class="card-label">🎮 Ausgewähltes Spiel</div>
        <div style="font-size:1.3rem; font-weight:bold; margin-top:5px;">${gameName}</div>
      </div>
      <div class="card" style="text-align:center;">
        <h3 style="color:var(--text-muted);">⏳ Warte darauf, dass der Host das Spiel startet...</h3>
      </div>
    `;
  },

  _changeGuestName() {
    const input = document.getElementById('sr-guest-name-change');
    const newName = (input?.value || '').trim();
    if (!newName) return;
    this.state.myName = newName;
    Multiplayer.sendToHost({ type: 'sr_name_change', myId: Multiplayer.myId, name: newName });
  },

  copyCode(btn) {
    if (!Multiplayer.hostId) return;
    navigator.clipboard.writeText(Multiplayer.hostId);
    const oldText = btn.innerHTML;
    btn.innerHTML = 'Kopiert! ✅';
    btn.style.background = '#22c55e';
    setTimeout(() => {
      btn.innerHTML = oldText;
      btn.style.background = '#ff3366';
    }, 2000);
  },

  /* ===== RETURN TO LOBBY (called after a game ends) ===== */
  returnToLobby() {
    if (!this.isActive) return;
    this.isInLobby = true;
    this._wireCallbacks();

    if (Multiplayer.role === 'host') {
      // Broadcast return to lobby to all guests
      Multiplayer.sendGameState({
        type: 'sr_return_to_lobby',
        players: this.state.players.map(p => ({ id: p.id, name: p.name, isHost: p.isHost || false })),
        selectedGameId: this.selectedGameId
      });
      Router.go('play');
      this._renderHostLobby();
    } else {
      Router.go('play');
      this._renderGuestLobby({ players: this.state.players, selectedGameId: this.selectedGameId });
    }
  }
};
</script>

<script>
/* === spektrum.js === */
const Spektrum = {
  name: "Spektrum",
  tagline: "Skala. Tipp. Synchronisieren.",
  color: "#7c3aed",
  shadow: "rgba(124, 58, 237, 0.4)",
  glow: "rgba(124, 58, 237, 0.2)",
  emoji: "🌈",

  state: {
    players: [],
    mode: 'offline', // 'offline' or 'online'
    myName: 'Host'
  },

  open() {
    this.state.mode = 'offline';
    Router.go('setup');
    document.getElementById('setup-title').textContent = 'Spektrum';
    this.renderSetup();
  },

  renderSetup() {
    document.getElementById('setup-content').innerHTML = `
      <div class="card" style="position:relative; text-align:center; padding: 40px 20px;">
        <button class="btn-icon" style="position:absolute; top:10px; right:10px; background:rgba(255,255,255,0.05);" onclick="Router.go('home')">✕</button>
        <div style="font-size: 4rem; margin-bottom: 20px;">🌈</div>
        <h2 style="margin-bottom: 30px; font-family: 'Syne', sans-serif;">Wähle deinen Spielmodus</h2>
        <button class="btn-primary" onclick="Spektrum.startLocal()">Lokal spielen (Ein Gerät) 📱</button>
        <button class="btn-primary" style="background:#7c3aed; margin-top: 15px;" onclick="UnifiedLobby.open(Spektrum)">Online spielen 🌐</button>
        <p style="margin-top: 30px; color: var(--text-muted); font-size: 0.9rem;">
            <b>Hinweis:</b> Im Online-Modus nutzt Spektrum jetzt das allgemeine Raumsystem.
        </p>
      </div>
    `;
  },

  startLocal() {
    this.state.mode = 'offline';
    SpektrumEmbed.open({ mode: 'offline' });
  },

  // UnifiedLobby Integration
  onOnlineGameStart(settings) {
    this.state.mode = 'online';
    
    // Clean players array to avoid DataCloneError during postMessage
    settings.players = this.state.players.map(p => ({
      id: p.id,
      name: p.name,
      isHost: p.isHost || p.id === Multiplayer.hostId
    }));
    
    SpektrumEmbed.open({ mode: 'online', settings: settings });
  },

  // This handles data received from other players via the parent's Multiplayer object
  handleOnlineData(data, conn) {
    const iframe = document.getElementById('spektrum-iframe');
    if (iframe && iframe.contentWindow) {
      // Forward the data to the iframe
      iframe.contentWindow.postMessage({ type: 'mp-data', data: data }, '*');
